<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="password" name="" id="" placeholder="Enter Password"><button>show</button>
</body>

<script>
    let btn = document.querySelector("button");
    let input = document.querySelector("input");

    btn.addEventListener('click', () => {
        // console.log("Clicked Element:", e.target); // Pata chalega konsa button click hua
        // console.log("Input Value:", input.value);  // Pata chalega user ne kya type kiya
        // console.dir(input);// Input ki SAARI DOM properties list ho jayengi!

        if (btn.innerHTML === "show") {
            input.type = "text";
            btn.innerHTML = "hide";
        } else {
            input.type = "password";
            btn.innerHTML = "show";
        }

    })


</script>



</html>
