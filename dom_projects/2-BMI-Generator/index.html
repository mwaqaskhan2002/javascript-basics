<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-dark text-light">

    <main class="d-flex justify-content-center align-items-center min-vh-100">
        <div class="card p-4 shadow-lg bg-secondary text-light" style="width: 100%; max-width: 420px;">

            <h2 id="formTitle" class="h4 mb-3 text-center">BMI Calculator</h2>

            <!-- Form -->
            <form id="bmiForm" class="row g-3">

                <!-- Height Input -->
                <div class="col-12">
                    <label for="height" class="form-label">Height in CM:</label>
                    <input type="number" class="form-control" id="height" placeholder="e.g. 175" required>
                </div>

                <!-- Weight Input -->
                <div class="col-12">
                    <label for="weight" class="form-label">Weight in KG:</label>
                    <input type="number" class="form-control" id="weight" placeholder="e.g. 70" required>
                </div>

                <!-- Calculate Button -->
                <div class="col-12 mt-4">
                    <button class="btn btn-primary w-100" type="submit" id="calculateBtn">Calculate BMI</button>
                </div>

            </form>

            <!-- Results Display Area -->
            <div id="results" class="mt-4 text-start fs-6 h5 text-warning"></div>

            <!-- BMI Weight Guide -->
            <div id="weight-guide" class="mt-3 p-3 bg-dark rounded fs-6">
                <p class="mb-1 text-info"><strong>BMI Weight Guide</strong></p>
                <p class="mb-1">Under Weight = Less than 18.6</p>
                <p class="mb-1">Normal Range = 18.6 and 24.9</p>
                <p class="mb-0">Overweight = Greater than 24.9</p>
            </div>

        </div>
    </main>

    <script src="project2.js"></script>
</body>

</html>
